<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeReview-Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>&#128269; CodeReview-Agent</h1>
        <p class="subtitle">Paste code, click Review, get instant feedback</p>
    </header>

    <main>
        <section class="input-section">
            <div class="toolbar">
                <select id="languageSelect">
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                </select>
                <button id="reviewBtn">&#9654; Review</button>
                <button id="clearBtn">&#10005; Clear</button>
                <button id="sampleBtn">&#128203; Load Sample</button>
            </div>
            <textarea id="codeInput" placeholder="Paste your code here..." spellcheck="false"></textarea>
        </section>

        <section id="resultsSection" class="results-section hidden">
            <div class="score-bar">
                <div class="score-label">Quality Score</div>
                <div class="score-track"><div id="scoreFill" class="score-fill"></div></div>
                <div id="scoreValue" class="score-value">0</div>
            </div>

            <div class="summary-stats" id="summaryStats"></div>

            <div class="tabs">
                <button class="tab active" data-tab="issues">Issues</button>
                <button class="tab" data-tab="comparison">Before / After</button>
            </div>

            <div id="issuesPanel" class="tab-panel active">
                <div id="issueList" class="issue-list"></div>
            </div>

            <div id="comparisonPanel" class="tab-panel">
                <div class="diff-container">
                    <div class="diff-pane">
                        <h3>Original</h3>
                        <pre id="diffOriginal"></pre>
                    </div>
                    <div class="diff-pane">
                        <h3>Suggested Fix</h3>
                        <pre id="diffFixed"></pre>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
